{% extends "base.html" %}{% block title %}Sign Up — TrustLens{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span class="brand-icon">⬡</span> Trust<span class="brand-accent">Lens</span></div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Get unlimited product analysis & history</p>
    <form method="POST" class="auth-form">
      <div class="field-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="karthik_hegde" required minlength="3"/>
      </div>
      <div class="field-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required/>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 6 characters" required minlength="6"/>
      </div>
      <div class="field-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" placeholder="Repeat password" required/>
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
